name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        feature: ["", "gpu-detection", "terminal", "ping", "self-update"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.feature }}
      - run: cargo check --features "${{ matrix.feature }}"
      - run: cargo test --all-features
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  build-linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl --features full
      - name: Check binary size < 2MB
        run: |
          SIZE=$(stat -c%s target/x86_64-unknown-linux-musl/release/komari-agent-rs)
          echo "Binary size: $SIZE bytes ($(du -h target/x86_64-unknown-linux-musl/release/komari-agent-rs | cut -f1))"
          ls -lh target/x86_64-unknown-linux-musl/release/komari-agent-rs
          if [ "$SIZE" -ge 2097152 ]; then
            echo "::error::Binary size $SIZE bytes exceeds 2MB limit"
            exit 1
          fi
          echo "Size OK: $SIZE bytes (< 2MB)"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      - run: cargo build --release --features full
      - name: Check binary size < 2MB
        shell: pwsh
        run: |
          $path = "target\release\komari-agent-rs.exe"
          $size = (Get-Item $path).Length
          Write-Host "Binary size: $size bytes"
          Get-Item $path | Format-List Name, Length
          if ($size -ge 2097152) {
            Write-Error "Binary size $size bytes exceeds 2MB limit"
            exit 1
          }
          Write-Host "Size OK: $size bytes (< 2MB)"

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - run: cargo build --release --features full
      - name: Check binary size < 2MB
        run: |
          SIZE=$(stat -f%z target/release/komari-agent-rs)
          echo "Binary size: $SIZE bytes"
          ls -lh target/release/komari-agent-rs
          if [ "$SIZE" -ge 2097152 ]; then
            echo "::error::Binary size $SIZE bytes exceeds 2MB limit"
            exit 1
          fi
          echo "Size OK: $SIZE bytes (< 2MB)"
