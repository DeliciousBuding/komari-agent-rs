name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Feature-gate check: each feature must compile standalone ──
  check:
    name: check (${{ matrix.feature || 'default' }})
    strategy:
      fail-fast: false
      matrix:
        feature: ["", "gpu-detection", "terminal", "ping", "self-update"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.feature }}
      - run: cargo check --locked --features "${{ matrix.feature }}"

  # ── Lints: fmt + clippy, single pass ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-features -- -D warnings

  # ── Tests: full suite once (was duplicated across feature matrix) ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo test --locked --all-features

  # ── Coverage (free tier): llvm-cov → Codecov ──
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── Binary size gate: Linux musl (release profile parity) ──
  build-linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl --features full
      - name: Check binary size < 2MB
        run: |
          SIZE=$(stat -c%s target/x86_64-unknown-linux-musl/release/komari-agent-rs)
          echo "Binary size: $SIZE bytes"
          if [ "$SIZE" -ge 2097152 ]; then
            echo "::error::Binary size $SIZE bytes exceeds 2MB limit"
            exit 1
          fi
          echo "Size OK: $SIZE bytes (< 2MB)"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-musl-full
          path: target/x86_64-unknown-linux-musl/release/komari-agent-rs

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release --features full
      - name: Offline Windows installer regressions
        shell: pwsh
        run: ./tests/installers.ps1
      - name: Windows PowerShell 5.1 Unicode config regressions
        shell: powershell
        run: ./tests/installers.ps1
      - name: Check binary size < 2MB
        shell: pwsh
        run: |
          $size = (Get-Item target\release\komari-agent-rs.exe).Length
          Write-Host "Binary size: $size bytes"
          if ($size -ge 2097152) {
            Write-Error "Binary size $size bytes exceeds 2MB limit"
            exit 1
          }
          Write-Host "Size OK: $size bytes (< 2MB)"

  build-macos:
    runs-on: macos-latest
    env:
      # Pin so cc-compiled objects (ring) and the linker agree; otherwise a
      # cached ring built against the runner SDK (15.x) fails to link at 11.0.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-dt11
      - run: cargo build --locked --release --features full
      - name: Check binary size < 2MB
        run: |
          SIZE=$(stat -f%z target/release/komari-agent-rs)
          echo "Binary size: $SIZE bytes"
          if [ "$SIZE" -ge 2097152 ]; then
            echo "::error::Binary size $SIZE bytes exceeds 2MB limit"
            exit 1
          fi
          echo "Size OK: $SIZE bytes (< 2MB)"
