name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Single matrix job: every platform/feature builds in parallel.
  # Asset naming convention: komari-agent-rs-<os>-<arch>-<variant>
  #   - default: core monitoring (ping + metrics) — ALWAYS includes ping
  #   - full:    default + gpu-detection/terminal/self-update
  # Every platform publishes BOTH variants so no platform accidentally ships a
  # ping-less build under a bare <os>-<arch> name.
  # - Linux x86_64 musl (default + full) and arm64 use cross/musl for static binaries.
  # - macOS x86_64 runs on the Intel runner (macos-13), arm64 on Apple Silicon.
  # - Windows builds natively on windows-latest (MSVC).
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-default
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: default
            use_cross: false
            artifact: komari-agent-rs-linux-x86_64-default
            size_check: true

          - name: linux-x86_64-full
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: full
            use_cross: false
            artifact: komari-agent-rs-linux-x86_64-full
            size_check: true

          - name: linux-arm64-default
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            features: default
            use_cross: true
            artifact: komari-agent-rs-linux-arm64-default
            size_check: true

          - name: linux-arm64-full
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            features: full
            use_cross: true
            artifact: komari-agent-rs-linux-arm64-full
            size_check: true

          - name: freebsd-x86_64
            target: x86_64-unknown-freebsd
            os: ubuntu-latest
            features: full
            use_cross: true
            artifact: komari-agent-rs-freebsd-x86_64
            size_check: false

          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            features: full
            use_cross: false
            artifact: komari-agent-rs-windows-x86_64.exe
            size_check: true

          # Intel Mac binary. macos-13 was retired 2025-12-04; the current
          # Intel runner is macos-15-intel (supported until Aug 2027).
          - name: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-15-intel
            features: full
            use_cross: false
            artifact: komari-agent-rs-macos-x86_64
            size_check: true

          # macos-latest is Apple Silicon — native arm64 build, no cross needed.
          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            features: full
            use_cross: false
            artifact: komari-agent-rs-macos-arm64
            size_check: true

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache ~/.cargo and target/ keyed by target + features so parallel
      # matrix legs don't clobber each other's build cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}

      - name: Install musl-tools (Linux musl)
        if: ${{ !matrix.use_cross && contains(matrix.target, 'musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@cross

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Build (cross)
        if: ${{ matrix.use_cross }}
        run: cross build --release --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Check binary size < 2MB (Linux)
        if: ${{ matrix.size_check && runner.os == 'Linux' }}
        run: |
          SIZE=$(stat -c%s target/${{ matrix.target }}/release/komari-agent-rs)
          if [ "$SIZE" -ge 2097152 ]; then
            echo "::error::Binary size $SIZE bytes exceeds 2MB limit"
            exit 1
          fi
          echo "Size OK: $SIZE bytes (< 2MB)"

      - name: Check binary size < 2MB (macOS)
        if: ${{ matrix.size_check && runner.os == 'macOS' }}
        run: |
          SIZE=$(stat -f%z target/${{ matrix.target }}/release/komari-agent-rs)
          if [ "$SIZE" -ge 2097152 ]; then
            echo "::error::Binary size $SIZE bytes exceeds 2MB limit"
            exit 1
          fi
          echo "Size OK: $SIZE bytes (< 2MB)"

      - name: Check binary size < 2MB (Windows)
        if: ${{ matrix.size_check && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $size = (Get-Item "target\${{ matrix.target }}\release\komari-agent-rs.exe").Length
          if ($size -ge 2097152) {
            Write-Error "Binary size $size bytes exceeds 2MB limit"
            exit 1
          }
          Write-Host "Size OK: $size bytes (< 2MB)"

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/komari-agent-rs.exe" "${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/komari-agent-rs" "${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
